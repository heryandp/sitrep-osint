[package]
name = "security-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `src/security.js`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
regex = "1"
url = "2"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
rand = "0.9"
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "time"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
