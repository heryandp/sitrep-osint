[package]
name = "djp-sitrep"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `djp-sitrep`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "djp-sitrep"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
uptime-service-rs = { path = "../uptime-service-rs" }
security-rs = { path = "../security-rs" }
geocode-rs = { path = "../geocode-rs" }
exa-summary-rs = { path = "../exa-summary-rs" }
copernicus-rs = { path = "../copernicus-rs" }
tomtom-rs = { path = "../tomtom-rs" }
market-rs = { path = "../market-rs" }
news-service-rs = { path = "../news-service-rs" }
geo-sensors-rs = { path = "../geo-sensors-rs" }
reader-service-rs = { path = "../reader-service-rs" }
social-service-rs = { path = "../social-service-rs" }
cctv-catalog-rs = { path = "../cctv-catalog-rs" }
cctv-gateway-rs = { path = "../cctv-gateway-rs" }
bytes = "1"
url = "2"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }

[workspace]
