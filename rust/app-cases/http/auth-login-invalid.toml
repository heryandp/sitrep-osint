[request]
method = "POST"
path = "/api/auth/login"
body = '{"username":"invalid","password":"wrong"}'

[request.headers]
content-type = "application/json"

[response]
status = 400

[response.headers]
cache-control = "no-store"
content-type = "application/json"
referrer-policy = "same-origin"
x-content-type-options = "nosniff"
x-ratelimit-limit = "10"
x-ratelimit-remaining = "9"
