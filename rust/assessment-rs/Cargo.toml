[package]
name = "assessment-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `src/assessment.js`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fancy-regex = "0.14"
napi = "3"
napi-derive = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha1 = "0.10"
unicode-normalization = "0.1"
whatlang = "0.16"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
